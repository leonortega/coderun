[context]
cache_order = [
    "behavioral_skills",
    "docs_context",
    "code_context",
]
max_files = 20
max_lines_per_file = 500
max_tokens = 12000

[daemon]
max_concurrent = 10
request_timeout_ms = 30000
socket_path = "/tmp/coderun.sock"

[database]
max_connections = 5
path = "~/.coderun/data.db"

[index]
languages = [
    "rust",
    "markdown",
    "toml",
    "json",
    "shell",
    "typescript",
    "yaml",
    "sql",
    "python",
    "yaml",
]
path = "~/.coderun/index/"

[knowledge]
max_knowledge_entries = 10000

[logging]
file_path = "~/.coderun/logs/coderun.log"
level = "info"
max_size_mb = 100
retention_days = 7

[model]
default_tier = "balanced"
max_tokens_response = 4096
routing_enabled = false

[rtk]
compression_level = "balanced"
enabled = true
max_output_tokens = 8000

[skills]
auto_discover = true
max_skills_per_request = 5
path = ".coderun/skills/"
