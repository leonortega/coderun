[context]
cache_order = [
    "docs_context",
    "code_context",
]
max_files = 20
max_lines_per_file = 500
max_tokens = 12000

[daemon]
max_concurrent = 10
request_timeout_ms = 30000
socket_path = "/tmp/coderun.sock"

[database]
max_connections = 5
path = "~/.coderun/data.db"

[index]
languages = [
    "rust",
    "markdown",
    "toml",
    "json",
    "shell",
    "typescript",
    "yaml",
    "sql",
    "python",
    "yaml",
]
path = "~/.coderun/index/"
# Watch mode for auto-reindexing: "commit" (default, triggers on git commit) or "filesystem" (triggers on any file change)
watch_mode = "commit"

[knowledge]
max_knowledge_entries = 10000

[logging]
file_path = "~/.coderun/logs/coderun.log"
level = "info"
max_size_mb = 100
retention_days = 7

[rtk]
compression_level = "balanced"
enabled = true
max_output_tokens = 8000
