# AI Runtime — Default Configuration
# See docs/01-architecture/RUNTIME.md for full schema reference

[daemon]
socket_path = "/tmp/coderun.sock"
max_concurrent = 10
request_timeout_ms = 30000

[database]
path = "~/.coderun/data.db"
max_connections = 5

[index]
path = "~/.coderun/index/"
languages = ["rust", "typescript", "javascript", "python", "go", "java", "c", "cpp"]

[knowledge]
memory_enabled = true
memory_endpoint = "http://localhost:9090"
max_knowledge_entries = 10000

[skills]
path = ".coderun/skills/"
auto_discover = true
max_skills_per_request = 5

[context]
max_tokens = 12000
max_files = 20
max_lines_per_file = 500
cache_order = ["behavioral_skills", "docs_context", "code_context"]

[model]
default_tier = "balanced"
routing_enabled = true
max_tokens_response = 4096

[routing]
structural_weight = 0.3
semantic_weight = 0.4
scope_weight = 0.3
fast_threshold = 0.3
capable_threshold = 0.7
fast_model = "gpt-4o-mini"
balanced_model = "gpt-4o"
capable_model = "o1"

[litellm]
endpoint = "http://localhost:4000"
timeout_ms = 30000
max_retries = 3

[rtk]
enabled = true
max_output_tokens = 8000
compression_level = "balanced"

[logging]
level = "info"
file_path = "~/.coderun/logs/coderun.log"
max_size_mb = 100
retention_days = 7
