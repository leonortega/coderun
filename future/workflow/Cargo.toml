[package]
name = "coderun-workflow"
version = "0.6.0"
edition = "2021"
description = "Coderun workflow (future, DBOS) — preserved out of v1 hot path, opt-in via future/workflow"
license = "MIT"

[dependencies]
coderun-core = { path = "../../crates/coderun-core" }
coderun-storage = { path = "../../crates/coderun-storage" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
async-trait = "0.1"
axum = "0.7"
