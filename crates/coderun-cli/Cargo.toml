[package]
name = "coderun-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "coderun"
path = "src/main.rs"

[dependencies]
coderun-core.workspace = true
coderun-storage.workspace = true
coderun-events.workspace = true
coderun-repo-intel = { workspace = true, features = ["fs-watcher"] }
coderun-context.workspace = true
coderun-knowledge.workspace = true
coderun-optimizer.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
tiktoken-rs.workspace = true
tokio.workspace = true
reqwest = { version = "0.13", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
tree-sitter-language-pack = "1"

[features]
default = []
