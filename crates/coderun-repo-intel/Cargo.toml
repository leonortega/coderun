[package]
name = "coderun-repo-intel"
version.workspace = true
edition.workspace = true

[dependencies]
coderun-core.workspace = true
coderun-events.workspace = true
coderun-storage.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex.workspace = true
glob.workspace = true
tracing.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
tempfile = "3"
# Windows verbatim-path (\\?\\) cleanup for stable repository identity + provenance (TASK-030/033)
dunce = "1"

# Ripgrep libraries for fast text search
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
ignore = "0.4"

# Tree-sitter for AST parsing — 371 languages via tree-sitter-language-pack
tree-sitter-language-pack = "1"

# First-class Git trigger (v0.5.0): notify + git2 primary, polling fallback
notify = { version = "6", optional = true }
git2 = { version = "0.19", optional = true }

[features]
git-watcher = ["dep:notify", "dep:git2"]
