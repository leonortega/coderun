[package]
name = "coderun-repo-intel"
version.workspace = true
edition.workspace = true

[dependencies]
coderun-core.workspace = true
coderun-events.workspace = true
coderun-storage.workspace = true
tokio.workspace = true
serde.workspace = true
sha2.workspace = true
regex.workspace = true
glob.workspace = true
tracing.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
tempfile = "3"
# Windows verbatim-path (\\?\\) cleanup for stable repository identity + provenance (TASK-030/033)
dunce = "1"

# Ripgrep libraries for fast text search
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
ignore = "0.4"

# Tree-sitter for AST parsing — 5 default + 4 behind extended-languages (v0.6.0)
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }

# First-class Git trigger (v0.5.0): notify + git2 primary, polling fallback
notify = { version = "6", optional = true }
git2 = { version = "0.19", optional = true }

[features]
git-watcher = ["dep:notify", "dep:git2"]
extended-languages = ["dep:tree-sitter-go", "dep:tree-sitter-java", "dep:tree-sitter-c", "dep:tree-sitter-cpp"]
