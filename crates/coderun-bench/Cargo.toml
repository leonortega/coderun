[package]
name = "coderun-bench"
version.workspace = true
edition.workspace = true
publish = false

[[bench]]
name = "context_bench"
path = "benches/context_bench.rs"
harness = false

[[bench]]
name = "rtk_bench"
path = "benches/rtk_bench.rs"
harness = false

[[bench]]
name = "tree_sitter"
path = "benches/tree_sitter.rs"
harness = false

[dependencies]
coderun-core.workspace = true
coderun-events.workspace = true
coderun-storage.workspace = true
coderun-repo-intel.workspace = true
coderun-knowledge.workspace = true
coderun-context.workspace = true
coderun-optimizer.workspace = true
criterion = { version = "0.8", features = ["async_tokio"] }
tokio.workspace = true
tiktoken-rs.workspace = true
sha2.workspace = true
tracing.workspace = true
serde_json.workspace = true
tree-sitter-language-pack = "1"
