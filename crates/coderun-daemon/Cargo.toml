[package]
name = "coderun-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "coderun-daemon"
path = "src/main.rs"

[dependencies]
coderun-core.workspace = true
coderun-events.workspace = true
coderun-storage.workspace = true
coderun-repo-intel = { workspace = true, features = ["fs-watcher"] }
coderun-knowledge.workspace = true
coderun-context.workspace = true
coderun-optimizer.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rmp-serde.workspace = true
serde.workspace = true
axum = "0.8"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2.workspace = true
chrono.workspace = true
prometheus = { version = "0.14", optional = true }

[features]
default = []
