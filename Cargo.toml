[workspace]
resolver = "2"
members = [
    "crates/coderun-core",
    "crates/coderun-daemon",
    "crates/coderun-cli",
    "crates/coderun-repo-intel",
    "crates/coderun-knowledge",
    "crates/coderun-skills",
    "crates/coderun-context",
    "crates/coderun-router",
    "crates/coderun-optimizer",
    "crates/coderun-events",
    "crates/coderun-storage",
    "crates/coderun-bench",
]
exclude = ["crates/coderun-workflow", "future/workflow", "workflow/dbos"]

[workspace.package]
# ── VERSION SINGLE SOURCE OF TRUTH ─────────────────────────────────────
# This is THE version of coderun. All crates inherit it (version.workspace = true);
# /health + daemon banner derive it at compile time (CARGO_PKG_VERSION); the npm
# plugin consumes it via packages/opencode-coderun/scripts/sync-version.mjs on build.
# To release: change this line, run scripts/compile.ps1, then tag vX.Y.Z and push.
version = "0.7.5"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
linker_messages = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(windows_raw_dylib)'] }

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
hmac = "0.12"
sha2 = "0.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Errors
anyhow = "1"
thiserror = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
glob = "0.3"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# IPC
rmp-serde = "1"

# Token counting (spec §3 — tiktoken-rs, never via model API)
tiktoken-rs = "0.7"

# CLI
clap = { version = "4", features = ["derive"] }

# External tools — first-class (v0.5.0): notify/git2 (ort is per-crate optional)
notify = "6"
git2 = "0.19"

# Internal crates
coderun-core = { path = "crates/coderun-core" }
coderun-events = { path = "crates/coderun-events" }
coderun-storage = { path = "crates/coderun-storage" }
coderun-repo-intel = { path = "crates/coderun-repo-intel" }
coderun-knowledge = { path = "crates/coderun-knowledge" }
coderun-skills = { path = "crates/coderun-skills" }
coderun-context = { path = "crates/coderun-context" }
coderun-router = { path = "crates/coderun-router" }
coderun-optimizer = { path = "crates/coderun-optimizer" }
coderun-daemon = { path = "crates/coderun-daemon" }
coderun-cli = { path = "crates/coderun-cli" }
# future/workflow — opt-in only: coderun-workflow = { path = "crates/coderun-workflow" }
