    - type: equals
      value: "balanced"

- description: "Add error handling"
  vars:
    task: "add comprehensive error handling to the database module"
    file_count: 3
    symbol_count: 8
    knowledge_entries: 2
    skills_matched: 0
    token_count: 1200
