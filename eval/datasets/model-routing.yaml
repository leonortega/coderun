    file_count: 15
    symbol_count: 80
    knowledge_entries: 8
    skills_matched: 3
    token_count: 10000
  assert:
    - type: equals
      value: "capable"

- description: "Implement complex feature"
  vars:
    task: "implement a complete OAuth2 authentication system with JWT tokens, refresh tokens, role-based access control, and session management"
    file_count: 12
    symbol_count: 60
    knowledge_entries: 6
    skills_matched: 2
    token_count: 8000
  assert:
    - type: equals
      value: "capable"

- description: "Performance optimization"
  vars:
    task: "optimize the query performance by implementing caching, connection pooling, read replicas, and database indexing strategy"
    file_count: 10
    symbol_count: 40
    knowledge_entries: 5
    skills_matched: 2
    token_count: 6000
  assert:
    - type: equals
      value: "capable"

# Edge cases
- description: "Empty task"
  vars:
    task: ""
    file_count: 0
    symbol_count: 0
    knowledge_entries: 0
    skills_matched: 0
    token_count: 0
  assert:
    - type: equals
      value: "fast"

- description: "Very long task"
  vars:
    task: "implement a complete redesign of the entire system architecture including but not limited to database schema changes, API endpoint restructuring, authentication system overhaul, caching layer implementation, message queue integration, monitoring and alerting setup, CI/CD pipeline configuration, documentation updates, and comprehensive test coverage"
    file_count: 20
