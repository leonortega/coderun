# Model Routing Evaluation Dataset
# Tests that the Model Router correctly selects the appropriate tier

# Simple tasks → should route to FAST tier
- description: "Simple typo fix"
  vars:
    task: "fix a typo in the README"
    file_count: 1
    symbol_count: 2
    knowledge_entries: 0
    skills_matched: 0
    token_count: 100
  assert:
    - type: equals
      value: "fast"

- description: "Add a comment"
  vars:
    task: "add a comment to the main function"
    file_count: 1
    symbol_count: 3
    knowledge_entries: 0
    skills_matched: 0
    token_count: 150
  assert:
    - type: equals
      value: "fast"

- description: "Rename variable"
  vars:
    task: "rename the variable 'x' to 'counter'"
    file_count: 1
    symbol_count: 1
    knowledge_entries: 0
    skills_matched: 0
    token_count: 80
  assert:
    - type: equals
      value: "fast"

# Moderate tasks → should route to BALANCED tier
