# Context Quality Evaluation Dataset
# Tests that the Context Engine produces high-quality context packs

- description: "Context includes mentioned files"
  vars:
    task: "implement a new function in src/auth.rs"
    files_mentioned: "src/auth.rs,src/config.rs"
  assert:
    - type: contains
      value: "src/auth.rs"

- description: "Context respects token budget"
  vars:
    task: "explain the codebase"
    max_tokens: 5000
  assert:
    - type: contains
      value: "total_tokens"

- description: "Context includes matched skills"
  vars:
    task: "add rate limiting to the API"
    skills_matched: "Rate Limiting:0.8"
  assert:
    - type: contains
      value: "Rate Limiting"

- description: "Context includes relevant knowledge"
  vars:
    task: "use snake_case for variables"
    knowledge_entries: "naming_convention:Use snake_case"
  assert:
    - type: contains
      value: "snake_case"

- description: "Context handles empty query gracefully"
  vars:
    task: ""
  assert:
    - type: contains
      value: "total_tokens"

- description: "Context truncates large content"
  vars:
    task: "show me everything"
    large_file_count: 100
  assert:
    - type: contains
      value: "total_tokens"

- description: "Context includes routing decision"
  vars:
    task: "implement a new feature"
  assert:
    - type: contains
      value: "token_usage"

- description: "Context handles multiple skills"
  vars:
    task: "implement authentication with rate limiting"
    skills_matched: "Authentication:0.9,Rate Limiting:0.7"
  assert:
    - type: contains
      value: "Authentication"

- description: "Context handles knowledge categories"
  vars:
    task: "follow the project conventions"
    knowledge_entries: "convention:Use TypeScript strict mode,pattern:Use functional components"
  assert:
    - type: contains
      value: "convention"
