# Promptfoo Evaluation Configuration for Coderun AI Runtime
# 
# Usage:
#   npx promptfoo eval          # Run all evaluations
#   npx promptfoo view          # View results in web UI
#   npx promptfoo eval -c eval/promptfoo.yaml
#
# Prerequisites:
#   npm install -g promptfoo

description: "Coderun AI Runtime Evaluation"

# Providers - custom functions that call Coderun
providers:
  - eval/providers/model-routing.js
  - eval/providers/context-quality.js

# Test datasets
tests:
  - eval/datasets/model-routing.yaml
  - eval/datasets/context-quality.yaml

# Output settings
outputPath: eval/results/evaluation.json

# Scoring
defaultTest:
  threshold: 0.8

# Prompts (not used directly, but documented here)
# The providers handle the actual API calls to Coderun
