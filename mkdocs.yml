site_name: Coderun AI Runtime
site_description: AI Runtime for coding agents — Repository Intelligence, Context Engine, Model Router, Execution Optimizer
repo_url: https://github.com/leonortega/coderun
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.follow
markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - toc:
      permalink: true
nav:
  - Home: README.md
  - Architecture:
    - Overview: docs/01-architecture/ARCHITECTURE.md
    - Components: docs/01-architecture/COMPONENTS.md
    - Data Flow: docs/01-architecture/DATA_FLOW.md
    - Request Lifecycle: docs/01-architecture/REQUEST_LIFECYCLE.md
    - Runtime: docs/01-architecture/RUNTIME.md
    - FlashRank Removal: docs/01-architecture/FLASHRANK_REMOVAL.md
  - Guides:
    - Adapters: docs/ADAPTERS.md
    - Evaluation: docs/EVALUATION.md
    - Roadmap: docs/ROADMAP.md
    - Skills Spec: docs/03-skills/SPEC.md
    - Workflows (DBOS): docs/02-workflows/DBOS.md
    - Dashboards: docs/dashboards/coderun.json
  - Reference:
    - Principles: docs/00-project/PRINCIPLES.md
    - Scope: docs/00-project/SCOPE.md
    - Project: docs/00-project/PROJECT.md
    - Glossary: docs/00-project/GLOSSARY.md

# Knowledge Hub ingestion: on `coderun index`, walk docs/**/*.md and push category=docs entries into tantivy
# (repository-stamped since TASK-030 — retrieval is scoped per repo).
# Deploy: `mkdocs gh-deploy` or `mkdocs build` → docs-site/build → served via GitHub Pages.
# NOTE (TASK-038): docs-site/build applies to the CODERUN repo's own site only. Per-target builds
# of an ANALYZED repo's docs land in <analyzed-repo>/.coderun/artifacts/ — never in this repository.
