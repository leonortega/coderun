site_name: Coderun AI Runtime
site_description: AI Runtime for coding agents — Repository Intelligence, Context Engine, Model Router, Execution Optimizer
repo_url: https://github.com/leonortega/coderun
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.follow
markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - toc:
      permalink: true
nav:
  - Home: README.md
  - Architecture:
    - Overview: docs/01-architecture/ARCHITECTURE.md
    - Components: docs/01-architecture/COMPONENTS.md
    - Data Flow: docs/01-architecture/DATA_FLOW.md
    - Request Lifecycle: docs/01-architecture/REQUEST_LIFECYCLE.md
  - Guides:
    - Adapters: docs/ADAPTERS.md
    - Evaluation: docs/EVALUATION.md
    - Roadmap: docs/ROADMAP.md
    - V0.3.0 Plan: docs/V0_3_0_PLAN.md
    - V0.4.0 Plan: docs/V0_4_0_PLAN.md
    - Workflows (DBOS): docs/02-workflows/DBOS.md
    - Dashboards: docs/dashboards/coderun.json
  - Reference:
    - Principles: docs/00-project/PRINCIPLES.md
    - Scope: docs/00-project/SCOPE.md

# Knowledge Hub ingestion: on `coderun index`, walk docs/**/*.md and push category=docs entries into tantivy.
# Deploy: `mkdocs gh-deploy` or `mkdocs build` → docs-site/build → served via GitHub Pages.
