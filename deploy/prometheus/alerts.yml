groups:
  - name: coderun
    rules:
      - alert: BuildContextP95High
        expr: histogram_quantile(0.95, rate(coderun_build_context_duration_seconds_bucket[5m])) > 0.05
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "BuildContext p95 >50ms" }
      - alert: FailOpenRateHigh
        expr: rate(coderun_fail_open_total[5m]) / rate(coderun_requests_total[5m]) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Fail-open rate >5%" }
